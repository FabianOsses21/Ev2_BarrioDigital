# Override para la etapa Oracle. Uso:
#   docker compose -f compose.yml -f compose.cloud.yml -f compose.oracle.yml up -d
# Requiere las variables ORACLE_* en .env (ver .env.example) y las tablas
# creadas previamente con infra/oracle/schema.sql en cada esquema.
services:
  catalog:
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      ORACLE_JDBC_URL: ${ORACLE_JDBC_URL:?Configura Oracle}
      ORACLE_USER: ${ORACLE_CATALOG_USER:?Configura el esquema}
      ORACLE_PASSWORD: ${ORACLE_CATALOG_PASSWORD:?Configura la contraseña}
  requests:
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      ORACLE_JDBC_URL: ${ORACLE_JDBC_URL:?Configura Oracle}
      ORACLE_USER: ${ORACLE_REQUESTS_USER:?Configura el esquema}
      ORACLE_PASSWORD: ${ORACLE_REQUESTS_PASSWORD:?Configura la contraseña}
  notify:
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      ORACLE_JDBC_URL: ${ORACLE_JDBC_URL:?Configura Oracle}
      ORACLE_USER: ${ORACLE_NOTIFY_USER:?Configura el esquema}
      ORACLE_PASSWORD: ${ORACLE_NOTIFY_PASSWORD:?Configura la contraseña}

# Si la cuenta Oracle exige wallet mTLS (Autonomous Database con
# "mTLS required"), descarga el wallet en el EC2 y descomenta por
# servicio:
#   catalog:
#     volumes: ["/home/ubuntu/wallet_bd:/app/wallet:ro"]
#     environment:
#       ORACLE_JDBC_URL: jdbc:oracle:thin:@<alias>_high?TNS_ADMIN=/app/wallet
