# Activar únicamente al configurar la cuenta Oracle. Sin fallback silencioso.
spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
# Instant se escribe y se compara en UTC consistentemente (evita
# desfase con TIMESTAMP de Oracle en consultas del scheduler).
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE_UTC
