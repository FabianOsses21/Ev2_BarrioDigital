spring.application.name=ms-barriodigital-requests
server.port=8083
app.auth.mode=${AUTH_MODE:entra}
app.auth.issuer=https://login.microsoftonline.com/${AZURE_TENANT_ID:f402d005-2163-4d89-a6cd-e07c25b973b2}/v2.0
app.auth.jwks=https://login.microsoftonline.com/${AZURE_TENANT_ID:f402d005-2163-4d89-a6cd-e07c25b973b2}/discovery/v2.0/keys
app.auth.audience=${AZURE_API_CLIENT_ID:54bc913a-2f45-4e55-9eae-b30616a9f8d5}
app.auth.scope=${AZURE_REQUIRED_SCOPE:OT.Create}
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=true
server.error.include-message=never
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:barriodigital}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:barriodigital-local}
spring.rabbitmq.virtual-host=/
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.requested-heartbeat=10s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.concurrency=1
app.queue.ttl-ms=${QUEUE_TTL_MS:30000}
app.dlq.ttl-ms=${DLQ_TTL_MS:604800000}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/requests;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.catalog.url=${CATALOG_URL:http://localhost:8082}
app.outbox.enabled=${OUTBOX_ENABLED:true}
app.outbox.delay-ms=2000
