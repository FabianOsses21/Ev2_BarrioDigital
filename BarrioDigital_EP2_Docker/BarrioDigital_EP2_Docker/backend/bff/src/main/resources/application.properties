spring.application.name=ms-barriodigital-bff
server.port=8081
app.auth.mode=${AUTH_MODE:entra}
app.auth.issuer=https://login.microsoftonline.com/${AZURE_TENANT_ID:f402d005-2163-4d89-a6cd-e07c25b973b2}/v2.0
app.auth.jwks=https://login.microsoftonline.com/${AZURE_TENANT_ID:f402d005-2163-4d89-a6cd-e07c25b973b2}/discovery/v2.0/keys
app.auth.audience=${AZURE_API_CLIENT_ID:54bc913a-2f45-4e55-9eae-b30616a9f8d5}
app.auth.scope=${AZURE_REQUIRED_SCOPE:OT.Create}
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=false
server.error.include-message=never
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:barriodigital}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:barriodigital-local}
spring.rabbitmq.virtual-host=/
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.requested-heartbeat=10s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.concurrency=1
app.queue.ttl-ms=${QUEUE_TTL_MS:30000}
app.dlq.ttl-ms=${DLQ_TTL_MS:604800000}

app.catalog.url=${CATALOG_URL:http://localhost:8082}
app.requests.url=${REQUESTS_URL:http://localhost:8083}
app.notify.url=${NOTIFY_URL:http://localhost:8084}
app.rabbitadmin.url=${RABBITADMIN_URL:http://localhost:8085}
